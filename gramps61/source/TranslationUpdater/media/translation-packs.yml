# Copy to .github/workflows/translation-packs.yml in CuratedGrampsPlugins.
#
# Builds Translation Updater language packs from the Weblate-maintained .po
# files on each Gramps maintenance branch and publishes them to the
# "translation-packs" branch (one commit, force-pushed, so history never grows).
#
# Weblate follows one branch at a time (gramps61 now), so DONOR lends that
# branch's translations to the older branches for strings that are word for
# word the same. Each branch also gets releases.json, which labels every addon
# release as code, translations, docs or version-only.
#
# Clients read e.g.
#   https://raw.githubusercontent.com/emyoulation/CuratedGrampsPlugins/translation-packs/gramps60/index.json
name: Translation packs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCHES: "gramps61 gramps60 gramps52"
  DONOR: "gramps61"
  SERVER: "gramps61/source/TranslationUpdater/server"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      - name: Fetch sources
        run: |
          set -e
          for branch in $BRANCHES; do
            git clone -q --depth 1 -b "maintenance/$branch" \
              https://github.com/gramps-project/gramps.git "src/gramps-$branch"
            # Full history for releases.json (about 110 MB; a blob-less clone
            # would fetch each old .gpr.py over the network, which is slower).
            git clone -q --single-branch -b "maintenance/$branch" \
              https://github.com/gramps-project/addons-source.git "src/addons-$branch"
          done

      - name: Build packs
        run: |
          set -e
          for branch in $BRANCHES; do
            donor=""
            if [ "$branch" != "$DONOR" ]; then
              donor="--donor-gramps src/gramps-$DONOR --donor-addons src/addons-$DONOR"
            fi
            python3 "$SERVER/build_translation_packs.py" \
              --branch "$branch" \
              --gramps "src/gramps-$branch" \
              --addons "src/addons-$branch" \
              $donor \
              --out site
            python3 "$SERVER/classify_releases.py" \
              --branch "$branch" \
              --addons "src/addons-$branch" \
              --out "site/$branch/releases.json"
          done

      - name: Publish to translation-packs branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b translation-packs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Translation packs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" translation-packs
