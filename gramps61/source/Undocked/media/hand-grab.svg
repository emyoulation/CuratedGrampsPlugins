  <title>Drag to move</title>
  <desc>Open hand, dark with a white outline so it shows on light and dark themes.</desc>
  <defs>
    <g id="hand">
      <rect x="6.4" y="4.2" width="2.8" height="10" rx="1.4"/>
      <rect x="9.5" y="2.4" width="2.8" height="11" rx="1.4"/>
      <rect x="12.6" y="3.2" width="2.8" height="10.5" rx="1.4"/>
      <rect x="15.7" y="5.6" width="2.6" height="8.6" rx="1.3"/>
      <rect x="2.2" y="9.6" width="2.8" height="7.2" rx="1.4" transform="rotate(-38 3.6 13.2)"/>
      <path d="M6.4 11 H18.3 V15.2 C18.3 19.1 15.9 21.6 12.4 21.6 H11.2 C9.2 21.6 7.9 20.8 6.8 19.2 L3.4 14.2 L5.2 12.6 L6.4 13.6 Z"/>
    </g>
  </defs>
  <use xlink:href="#hand" fill="#ffffff" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  <use xlink:href="#hand" fill="#2e3436"/>
</svg>
