<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="48" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Award rosette with checkmark</title>
  <style>
    /* Palette: edit here to recolor every object at once */
    .ribbon    { fill: #2a6ad8; }  /* blue */
    .medallion { fill: #d4a017; }  /* gold */
    .center    { fill: #3c9a3c; }  /* medium green */
    .outlined  { stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
    .check     { fill: none; stroke: #ffffff; stroke-width: 10;
                 stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <!-- One flared ribbon tail; the right tail reuses it mirrored -->
    <polygon id="ribbon-tail" points="54,86 80,98 62,135 47,123 22,132"/>
  </defs>

  <!-- Whole badge, shifted down to sit centered in the square -->
  <g id="badge" transform="translate(0,8)">

  <!-- Layer 1: ribbons (drawn first so they sit under the medallion) -->
  <g id="ribbons" class="ribbon outlined">
    <use id="ribbon-left" href="#ribbon-tail"/>
    <use id="ribbon-right" href="#ribbon-tail" transform="translate(160,0) scale(-1,1)"/>
  </g>

  <!-- Layer 2: scalloped medallion, squashed vertically to 72% -->
  <polygon id="medallion" class="medallion outlined"
           points="80.0,9.0 91.3,17.0 106.0,12.8 112.3,23.2 128.1,23.4 128.3,34.8 142.8,39.3 137.0,49.8 148.0,58.0 137.0,66.2 142.8,76.7 128.3,81.2 128.1,92.6 112.3,92.8 106.0,103.2 91.3,99.0 80.0,107.0 68.7,99.0 54.0,103.2 47.7,92.8 31.9,92.6 31.7,81.2 17.2,76.7 23.0,66.2 12.0,58.0 23.0,49.8 17.2,39.3 31.7,34.8 31.9,23.4 47.7,23.2 54.0,12.8 68.7,17.0"/>

  <!-- Layer 3: center, same 72% vertical squash -->
  <ellipse id="center" class="center outlined" cx="80" cy="58" rx="43.9" ry="31.6"/>

  <!-- Layer 4: checkmark (no border, by design) -->
  <polyline id="checkmark" class="check" points="60,60 74.5,70.5 102,46"/>
  </g>
</svg>
